<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D6 Online</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="logo">D6</div><div><h1>D6 Online</h1><p>O último sobrevivente vence.</p></div><span id="connection" class="pill">Conectando…</span></header><section id="home" class="panel"><h2>Entrar na batalha</h2><label>Seu nome<input id="name" maxlength="20" placeholder="Digite seu nome"></label><div class="actions"><button id="create">Criar sala</button><div class="join"><input id="roomCode" maxlength="5" placeholder="CÓDIGO"><button id="join">Entrar</button></div></div><p id="error" class="error"></p></section><section id="game" class="hidden"><div class="roombar panel"><div>SALA <strong id="code"></strong></div><button id="copy" class="secondary">Copiar código</button><span id="phase"></span></div><section id="lobby" class="panel"><h2>Jogadores</h2><div id="playersLobby" class="players"></div><label>Seu personagem<select id="character"></select></label><button id="start">Começar partida</button></section><section id="battle" class="hidden"><div class="board"><div class="panel"><h2>Estado da partida</h2><div id="playersBattle" class="players"></div></div><div class="panel turn"><h2 id="turnTitle">Turno</h2><p id="turnHint"></p><div id="dice" class="dice"></div><p id="skillHint">Escolha um dos dados para usar a habilidade correspondente.</p></div></div><div class="panel"><h2>Registro da partida</h2><div id="log" class="log"></div></div></section></section><footer>D6 Online · Protótipo multiplayer</footer></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
